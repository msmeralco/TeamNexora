name = "bahagi-messenger"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Show console.log / errors in the Cloudflare dashboard (Workers → bahagi-messenger → Logs)
[observability]
enabled = true

# Non-secret settings. Secrets are set with: npx wrangler secret put NAME  (see README)
[vars]
# Firebase → Build → Realtime Database → the URL at the top of the Data tab
FIREBASE_DATABASE_URL = "https://bahagi-f57d7-default-rtdb.asia-southeast1.firebasedatabase.app/"
SUPABASE_BUCKET = "flood-photos"
AWS_REGION = "ap-southeast-1"
BEDROCK_MODEL_ID = "global.amazon.nova-2-lite-v1:0"
DEPTH_SCALE = "0.1"      # 0.1 = 1:10 tabletop dashboard scale, 1 = real cm (use with VITE_SCALE=real)
GRAPH_VERSION = "v27.0"  # Meta Graph API version
